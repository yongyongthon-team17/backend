spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  mvc:
    problemdetails:
      enabled: false
  web:
    resources:
      add-mappings: false

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# AI 개선안(A04). 키는 환경 변수 OPENAI_API_KEY로만 읽는다(값을 이 파일에 쓰지 않는다).
# 모델은 프로파일별: 기본(local·test)=gpt-6-luna, prod=gpt-6.1-terra (application-prod.yaml)
app:
  analysis:
    transport-link:
      enabled: true # false면 A04 transport=NOT_ENABLED, 정류장 수를 LLM에 보내지 않음
    general-suggestion:
      # true면 부족한 점(관찰)이 없는 시설도 AI가 일반적인 보완 제안을 만든다(AI 호출이 늘어남).
      # false(기본)면 "현재 확인된 개선 사항이 없습니다." 고정 문구를 주고 AI를 호출하지 않는다.
      # 환경 변수: APP_ANALYSIS_GENERAL_SUGGESTION_ENABLED
      enabled: false
  llm:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-6-luna
    reasoning-effort: low
    timeout: 20s
    request-deadline: 30s
    max-output-tokens: 2000
    max-concurrency: 4
    max-generations-per-request: 10
    # AI 호출 한도(3분 윈도우, OpenAI를 실제로 호출한 횟수만 센다. 캐시 HIT은 세지 않음).
    # 개인(X-Client-Id)당 10건, IP당·서버 전체는 행사장 공유 Wi-Fi를 고려해 같은 값으로 시작. 환경 변수로 조정:
    # APP_LLM_RATE_LIMIT_ENABLED, _PER_CLIENT, _PER_IP, _GLOBAL
    rate-limit:
      enabled: true
      window: 3m
      per-client: 10
      per-ip: 150
      global: 150
  # CORS 허용 출처(쉼표 구분). 비어 있으면 교차 출처를 허용하지 않는다. local 기본값은 application-local.yaml
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
