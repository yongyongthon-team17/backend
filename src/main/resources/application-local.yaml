spring:
  datasource:
    url: jdbc:h2:mem:jigeumgayong;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 로컬 개발 데이터: 기동 시 공공데이터(ETL)와 로컬 전용 샘플을 적재한다.
# 테스트에서는 build.gradle의 system property로 꺼진다.
app:
  etl:
    enabled: true
  sample-data:
    enabled: true
